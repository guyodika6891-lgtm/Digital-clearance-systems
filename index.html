<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clearance System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Login Box -->
        <div class="login-box">
            <h1>🏛️ Digital Clearance System</h1>
            <h2>Login</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="student_id">Student ID / Username</label>
                    <input type="text" id="student_id" placeholder="Enter your Student ID" required autofocus>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your Password" required>
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
            </form>
            
            <p class="register-link">Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
        </div>
        
        <!-- Registration Box -->
        <div class="register-box">
            <h2>📝 Register</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label for="reg_student_id">Student ID</label>
                    <input type="text" id="reg_student_id" placeholder="Enter your Student ID" required>
                </div>
                
                <div class="input-group">
                    <label for="reg_full_name">Full Name</label>
                    <input type="text" id="reg_full_name" placeholder="Enter your Full Name" required>
                </div>
                
                <div class="input-group">
                    <label for="reg_email">Email</label>
                    <input type="email" id="reg_email" placeholder="Enter your Email" required>
                </div>
                
                <div class="input-group">
                    <label for="reg_password">Password</label>
                    <input type="password" id="reg_password" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                
                <div class="input-group">
                    <label for="reg_role">Role</label>
                    <select id="reg_role">
                        <option value="student">Student</option>
                        <option value="hod">Head of Department</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">Register</button>
            </form>
            <p class="login-link">Already have an account? <a href="#" onclick="showLogin()">Login here</a></p>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
